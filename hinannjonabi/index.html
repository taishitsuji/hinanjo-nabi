<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オフライン避難所ナビ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { overflow: hidden; touch-action: none; background-color: #0f172a; margin: 0; }
        
        /* 地図コンテナのスタイル */
        #map-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: 10; display: none;
        }
        #map-container {
            position: absolute; top: -50vh; left: -50vw;
            width: 200vw; height: 200vh;
            will-change: transform;
        }
        #map { width: 100%; height: 100%; background: #1e293b; }

        /* UIオーバーレイ */
        #ui-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
            background: linear-gradient(to top, rgba(15,23,42,1) 60%, rgba(15,23,42,0));
            padding: 40px 20px 20px 20px;
            display: none;
        }

        /* 中央のナビゲーションアイコン（自分の向き） */
        #center-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 40;
            width: 40px; height: 40px; pointer-events: none;
            display: none;
        }

        /* フリールックから現在地に戻るボタン */
        #resume-btn {
            position: absolute; top: 20px; right: 20px; z-index: 60;
            display: none;
        }
    </style>
</head>
<body class="text-white font-sans selection:bg-yellow-500 selection:text-black">

    <!-- スタート画面 -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-50 p-6 text-center">
        <h1 class="text-3xl font-bold mb-2 text-yellow-400">避難所マップナビ</h1>
        <p class="text-gray-400 text-sm mb-8">自分が向いている方向に地図が回転します。<br>圏外でもレーダーとして機能します。</p>
        <button id="start-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 px-10 rounded-full text-xl shadow-[0_0_20px_rgba(234,179,8,0.5)] active:scale-95 transition">
            ナビゲーション開始
        </button>
    </div>

    <!-- マップ画面 -->
    <div id="map-wrapper">
        <div id="map-container">
            <div id="map"></div>
        </div>
        
        <!-- 中央のポインター -->
        <div id="center-marker">
            <div class="w-6 h-6 bg-blue-500 border-4 border-white rounded-full shadow-[0_0_15px_rgba(59,130,246,0.8)] mx-auto mt-2 relative">
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-l-transparent border-r-transparent border-b-blue-500"></div>
            </div>
        </div>
        
        <button id="resume-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-full shadow-lg active:scale-95 transition">
            GPSに追従する
        </button>
    </div>

    <!-- 下部のステータス表示 -->
    <div
