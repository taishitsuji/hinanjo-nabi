<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オフライン避難所ナビ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { overflow: hidden; touch-action: none; background-color: #0f172a; margin: 0; }
        
        #map-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: 10; display: none;
        }
        #map-container {
            position: absolute; top: -50vh; left: -50vw;
            width: 200vw; height: 200vh;
            will-change: transform;
        }
        #map { width: 100%; height: 100%; background: #1e293b; }

        #ui-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
            background: linear-gradient(to top, rgba(15,23,42,1) 70%, rgba(15,23,42,0));
            padding: 40px 20px 20px 20px;
            display: none;
        }

        #center-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 40;
            width: 40px; height: 40px; pointer-events: none;
            display: none;
        }

        #resume-btn {
            position: absolute; bottom: 80px; right: 20px; z-index: 60;
            display: none;
        }

        /* 検索ボックス */
        #search-box {
            position: absolute; top: 16px; left: 16px; right: 16px; z-index: 65;
            display: none;
        }
        #search-results {
            max-height: 220px;
            overflow-y: auto;
            touch-action: pan-y;
        }

        /* 目的地ナビゲーションパネル */
        #nav-panel {
            position: absolute; top: 72px; left: 16px; right: 16px; z-index: 55;
            background: rgba(15, 23, 42, 0.94);
            border: 2px solid #eab308;
            border-radius: 12px;
            padding: 12px 16px;
            display: none;
        }

        /* トイレ用カスタムアイコン */
        .toilet-pin {
            background-color: #10b981;
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="text-white font-sans selection:bg-yellow-500 selection:text-black">

    <!-- スタート画面 -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-50 p-6 text-center">
        <h1 class="text-3xl font-bold mb-2 text-yellow-400">避難所マップナビ</h1>
        <p class="text-gray-400 text-sm mb-8">自分が向いている方向に地図が回転します。<br>オンライン時は道路ルート、圏外時は直線レーダーで誘導します。</p>
        <button id="start-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 px-10 rounded-full text-xl shadow-[0_0_20px_rgba(234,179,8,0.5)] active:scale-95 transition">
            ナビゲーション開始
        </button>
    </div>

    <!-- マップ画面 -->
    <div id="map-wrapper">
        <div id="map-container">
            <div id="map"></div>
        </div>

        <!-- 避難所検索バー -->
        <div id="search-box">
            <div class="relative">
                <input type="text" id="search-input" placeholder="避難所・トイレ名で検索" 
                    class="w-full bg-gray-900/95 text-white border border-gray-600 rounded-lg py-2.5 px-4 text-sm focus:outline-none focus:border-yellow-400 shadow-lg">
                <button id="clear-search-btn" class="hidden absolute right-3 top-2.5 text-gray-400 text-sm font-bold">✕</button>
            </div>
            <div id="search-results" class="hidden bg-gray-900/95 border border-gray-700 rounded-lg mt-1 shadow-xl divide-y divide-gray-800"></div>
        </div>
        
        <!-- 目的地ナビパネル -->
        <div id="nav-panel" class="flex justify-between items-center shadow-lg">
            <div>
                <div id="route-mode-label" class="text-xs text-yellow-400 font-bold">ルート検索中...</div>
                <div id="target-name" class="text-base font-bold truncate max-w-[210px]">-</div>
                <div id="target-dist" class="text-xl font-extrabold text-white mt-0.5">残り --- m</div>
            </div>
            <button id="cancel-nav-btn" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2.5 px-3.5 rounded-lg shrink-0">
                案内終了
            </button>
        </div>

        <!-- 中央のポインター -->
        <div id="center-marker">
            <div class="w-6 h-6 bg-blue-500 border-4 border-white rounded-full shadow-[0_0_15px_rgba(59,130,246,0.8)] mx-auto mt-2 relative">
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-l-transparent border-r-transparent border-b-blue-500"></div>
            </div>
        </div>
        
        <button id="resume-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-full shadow-lg active:scale-95 transition">
            GPSに追従する
        </button>
    </div>

    <!-- 下部のステータス表示 -->
    <div id="ui-overlay" class="flex justify-between items-end text-sm">
        <div id="status-text" class="text-gray-300">GPS測位待機中...</div>
        <div id="shelter-count" class="text-yellow-400 font-bold text-right"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録エラー:', err));
        }

        let map;
        let allShelters = [];
        let markerLayer;
        let routeLayer = null;
        let directLine = null;
        let targetShelter = null;
        let lastRouteFetchTime = 0;
        let lastRenderedCenter = null; // 前回ピンを描画した中心座標
        let openedPopupKey = null;     // 現在開いている吹き出しの識別キー

        let currentLat = 35.49895; // 初期値（市原市付近）
        let currentLng = 140.05860;
        let currentHeading = 0;
        let targetHeading = 0;
        let isTracking = true;

        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const mapWrapper = document.getElementById('map-wrapper');
        const centerMarker = document.getElementById('center-marker');
        const resumeBtn = document.getElementById('resume-btn');
        const uiOverlay = document.getElementById('ui-overlay');
        const statusText = document.getElementById('status-text');
        const shelterCount = document.getElementById('shelter-count');
        const mapContainer = document.getElementById('map-container');
        const navPanel = document.getElementById('nav-panel');
        const routeModeLabel = document.getElementById('route-mode-label');
        const targetNameEl = document.getElementById('target-name');
        const targetDistEl = document.getElementById('target-dist');
        const cancelNavBtn = document.getElementById('cancel-nav-btn');
        const searchBox = document.getElementById('search-box');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const clearSearchBtn = document.getElementById('clear-search-btn');

        window.startNavigationTo = function(name, lat, lng) {
            setTargetShelter(name, lat, lng);
            openedPopupKey = null;
            if (map) map.closePopup();
        };

        // 1. スタートボタン押下時
        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('コンパスの利用が許可されませんでした。');
                        return; 
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            startScreen.style.display = 'none';
            mapWrapper.style.display = 'block';
            centerMarker.style.display = 'block';
            uiOverlay.style.display = 'flex';
            searchBox.style.display = 'block';

            initMap();
            startSensors();
        });

        // 2. 地図の初期構築
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([currentLat, currentLng], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            markerLayer = L.layerGroup().addTo(map);

            // 吹き出しが手動で閉じられたら記憶を消す
            map.on('popupclose', () => {
                // 再描画中の一時的なクローズでない場合のみリセット
                if (!window.isRedrawingMarkers) {
                    openedPopupKey = null;
                }
            });

            shelterCount.innerText = 'データ読込中...';
            fetch('./shelters.json')
                .then(res => res.json())
                .then(data => {
                    allShelters = data;
                    updateVisibleShelters(currentLat, currentLng, true);
                })
                .catch(err => {
                    shelterCount.innerText = 'データ読込失敗';
                });

            map.on('dragstart', () => {
                isTracking = false;
                resumeBtn.style.display = 'block';
            });

            map.on('moveend', () => {
                const center = map.getCenter();
                // 1km以上移動したときだけピンを再描画する（小さな揺れで吹き出しが消えるのを防止）
                if (!lastRenderedCenter || center.distanceTo(lastRenderedCenter) > 1000) {
                    updateVisibleShelters(center.lat, center.lng, false);
                }
            });
        }

        // トイレ用アイコン定義
        const toiletIcon = L.divIcon({
            className: 'toilet-pin',
            html: 'WC',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });

        // 3. 周辺の避難所・トイレ描画
        function updateVisibleShelters(centerLat, centerLng, force) {
            if (!allShelters || allShelters.length === 0) return;
            
            lastRenderedCenter = L.latLng(centerLat, centerLng);
            window.isRedrawingMarkers = true;
            markerLayer.clearLayers();
            
            let count = 0;
            const range = 0.15;

            for (let i = 0; i < allShelters.length; i++) {
                const s = allShelters[i];
                const sLat = Number(s.lat);
                const sLon = Number(s.lon !== undefined ? s.lon : s.lng);

                if (!isNaN(sLat) && !isNaN(sLon) && Math.abs(sLat - centerLat) < range && Math.abs(sLon - centerLng) < range) {
                    const key = `${s.name}_${sLat}_${sLon}`;
                    const safeName = s.name.replace(/'/g, "\\'");
                    const badges = [];
                    if (s.isEmg) badges.push('<span class="bg-red-100 text-red-800 text-[10px] px-1.5 py-0.5 rounded">緊急避難</span>');
                    if (s.isShl) badges.push('<span class="bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded">避難所</span>');
                    if (s.hasTo) badges.push('<span class="bg-emerald-100 text-emerald-800 text-[10px] px-1.5 py-0.5 rounded">トイレ</span>');

                    const html = `
                        <div class="text-center p-1 min-w-[140px]">
                            <div class="font-bold text-gray-900 text-sm mb-1">${s.name}</div>
                            <div class="flex justify-center gap-1 mb-2">${badges.join('')}</div>
                            <button onclick="window.startNavigationTo('${safeName}', ${sLat}, ${sLon})" 
                                class="w-full bg-blue-600 active:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded shadow">
                                ここへ経路案内
                            </button>
                        </div>
                    `;

                    // トイレ専用データ（避難所フラグがなくトイレフラグがあるもの）は緑色のWCピンにする
                    const isToiletOnly = (s.hasTo === 1 && !s.isEmg && !s.isShl);
                    const markerOptions = isToiletOnly ? { icon: toiletIcon } : {};

                    const marker = L.marker([sLat, sLon], markerOptions)
                     .addTo(markerLayer)
                     .bindPopup(html, { autoClose: true, closeOnClick: false });

                    marker.on('click', () => {
                        openedPopupKey = key;
                    });

                    // 再描画前に開いていた吹き出しがあれば即座に開き直す
                    if (openedPopupKey === key) {
                        marker.openPopup();
                    }

                    count++;
                }
            }
            window.isRedrawingMarkers = false;
            shelterCount.innerText = `表示中: ${count}件 / 全${allShelters.length}件`;
        }

        // 検索機能
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.trim();
            if (!keyword) {
                searchResults.classList.add('hidden');
                clearSearchBtn.classList.add('hidden');
                return;
            }
            clearSearchBtn.classList.remove('hidden');

            const matches = allShelters.filter(s => s.name && s.name.includes(keyword)).slice(0, 30);
            searchResults.innerHTML = '';

            if (matches.length === 0) {
                searchResults.innerHTML = '<div class="p-3 text-xs text-gray-400">一致する施設が見つかりません</div>';
            } else {
                matches.forEach(s => {
                    const sLat = Number(s.lat);
                    const sLon = Number(s.lon !== undefined ? s.lon : s.lng);
                    const item = document.createElement('div');
                    item.className = 'p-3 text-sm hover:bg-gray-800 cursor-pointer flex justify-between items-center';
                    item.innerHTML = `
                        <span class="font-bold text-white truncate pr-2">${s.name}</span>
                        <span class="text-xs bg-yellow-500 text-black font-bold px-2.5 py-1 rounded shrink-0">経路案内</span>
                    `;
                    item.addEventListener('click', () => {
                        setTargetShelter(s.name, sLat, sLon);
                        searchResults.classList.add('hidden');
                        searchInput.value = s.name;
                    });
                    searchResults.appendChild(item);
                });
            }
            searchResults.classList.remove('hidden');
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchResults.classList.add('hidden');
            clearSearchBtn.classList.add('hidden');
        });

        // 4. 目的地セット＆経路描画
        function setTargetShelter(name, lat, lng) {
            targetShelter = { name, lat, lng };
            targetNameEl.innerText = name;
            navPanel.style.display = 'flex';
            isTracking = true;
            resumeBtn.style.display = 'none';
            map.setView([currentLat, currentLng], 16);
            updateVisibleShelters(currentLat, currentLng, true);
            lastRouteFetchTime = 0;
            updateNavigationRoute();
        }

        cancelNavBtn.addEventListener('click', () => {
            targetShelter = null;
            navPanel.style.display = 'none';
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            if (directLine) {
                map.removeLayer(directLine);
                directLine = null;
            }
        });

        async function updateNavigationRoute() {
            if (!targetShelter) return;

            const from = L.latLng(currentLat, currentLng);
            const to = L.latLng(targetShelter.lat, targetShelter.lng);
            const directDist = Math.round(from.distanceTo(to));

            if (directLine) {
                directLine.setLatLngs([from, to]);
            } else {
                directLine = L.polyline([from, to], {
                    color: '#ef4444',
                    weight: 3,
                    opacity: 0.6,
                    dashArray: '8, 8'
                }).addTo(map);
            }

            const now = Date.now();
            if (now - lastRouteFetchTime < 10000 && routeLayer) {
                return;
            }
            lastRouteFetchTime = now;

            try {
                const url = `https://router.project-osrm.org/route/v1/foot/${currentLng},${currentLat};${targetShelter.lng},${targetShelter.lat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Route API Error');
                const data = await res.json();

                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const routeDist = Math.round(route.distance);
                    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

                    routeModeLabel.innerText = '道路ルート案内中（青線）';
                    routeModeLabel.className = 'text-xs text-cyan-400 font-bold';
                    targetDistEl.innerText = routeDist >= 1000 
                        ? `道なり ${(routeDist / 1000).toFixed(2)} km` 
                        : `道なり ${routeDist} m`;

                    if (routeLayer) {
                        routeLayer.setLatLngs(coords);
                    } else {
                        routeLayer = L.polyline(coords, {
                            color: '#06b6d4',
                            weight: 7,
                            opacity: 0.9
                        }).addTo(map);
                    }
                } else {
                    throw new Error('No route found');
                }
            } catch (err) {
                if (routeLayer) {
                    map.removeLayer(routeLayer);
                    routeLayer = null;
                }
                routeModeLabel.innerText = '圏外レーダー誘導（赤点線）';
                routeModeLabel.className = 'text-xs text-yellow-400 font-bold';
                targetDistEl.innerText = directDist >= 1000 
                    ? `直線 ${(directDist / 1000).toFixed(2)} km` 
                    : `直線 ${directDist} m`;
            }
        }

        // 5. センサー類の開始
        function startSensors() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    position => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        statusText.innerText = 'GPS受信中';
                        
                        if (isTracking) {
                            map.setView([currentLat, currentLng], map.getZoom(), { animate: false });
                        }
                        updateNavigationRoute();
                    },
                    error => {
                        statusText.innerText = 'GPSエラー: ' + error.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            }

            window.addEventListener('deviceorientation', event => {
                let heading = null;
                if (event.webkitCompassHeading) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    heading = Math.abs(event.alpha - 360);
                }

                if (heading !== null) {
                    targetHeading = heading;
                }
            });

            updateRotation();
        }

        // 6. 地図の回転アニメーション
        function updateRotation() {
            let diff = targetHeading - currentHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            
            currentHeading += diff * 0.1;
            
            if (isTracking) {
                mapContainer.style.transform = `rotate(-${currentHeading}deg)`;
            } else {
                mapContainer.style.transform = `rotate(0deg)`;
            }

            requestAnimationFrame(updateRotation);
        }

        // 7. GPS追従モードへの復帰
        resumeBtn.addEventListener('click', () => {
            isTracking = true;
            resumeBtn.style.display = 'none';
            map.setView([currentLat, currentLng], map.getZoom());
        });
    </script>
</body>
</html>
