<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オフライン避難所ナビ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { overflow: hidden; touch-action: none; background-color: #0f172a; margin: 0; }
        
        #map-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: 10; display: none;
        }
        #map-container {
            position: absolute; top: -50vh; left: -50vw;
            width: 200vw; height: 200vh;
            will-change: transform;
        }
        #map { width: 100%; height: 100%; background: #1e293b; }

        #ui-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
            background: linear-gradient(to top, rgba(15,23,42,1) 70%, rgba(15,23,42,0));
            padding: 40px 20px 20px 20px;
            display: none;
        }

        #center-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 40;
            width: 40px; height: 40px; pointer-events: none;
            display: none;
        }

        #resume-btn {
            position: absolute; top: 20px; right: 20px; z-index: 60;
            display: none;
        }

        /* 目的地ナビゲーションパネル */
        #nav-panel {
            position: absolute; top: 20px; left: 20px; right: 20px; z-index: 55;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #eab308;
            border-radius: 12px;
            padding: 12px 16px;
            display: none;
        }
    </style>
</head>
<body class="text-white font-sans selection:bg-yellow-500 selection:text-black">

    <!-- スタート画面 -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-50 p-6 text-center">
        <h1 class="text-3xl font-bold mb-2 text-yellow-400">避難所マップナビ</h1>
        <p class="text-gray-400 text-sm mb-8">自分が向いている方向に地図が回転します。<br>圏外でもレーダーとして機能します。</p>
        <button id="start-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 px-10 rounded-full text-xl shadow-[0_0_20px_rgba(234,179,8,0.5)] active:scale-95 transition">
            ナビゲーション開始
        </button>
    </div>

    <!-- マップ画面 -->
    <div id="map-wrapper">
        <div id="map-container">
            <div id="map"></div>
        </div>
        
        <!-- 目的地ナビパネル -->
        <div id="nav-panel" class="flex justify-between items-center shadow-lg">
            <div>
                <div class="text-xs text-yellow-400 font-bold">目的地へ誘導中</div>
                <div id="target-name" class="text-base font-bold truncate max-w-[200px]">-</div>
                <div id="target-dist" class="text-xl font-extrabold text-white mt-0.5">残り --- m</div>
            </div>
            <button id="cancel-nav-btn" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 px-3 rounded-lg">
                案内終了
            </button>
        </div>

        <!-- 中央のポインター -->
        <div id="center-marker">
            <div class="w-6 h-6 bg-blue-500 border-4 border-white rounded-full shadow-[0_0_15px_rgba(59,130,246,0.8)] mx-auto mt-2 relative">
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-l-transparent border-r-transparent border-b-blue-500"></div>
            </div>
        </div>
        
        <button id="resume-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-full shadow-lg active:scale-95 transition">
            GPSに追従する
        </button>
    </div>

    <!-- 下部のステータス表示 -->
    <div id="ui-overlay" class="flex justify-between items-end text-sm">
        <div id="status-text" class="text-gray-300">GPS測位待機中...</div>
        <div id="shelter-count" class="text-yellow-400 font-bold"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録エラー:', err));
        }

        let map;
        let allShelters = [];
        let markerLayer;
        let guideLine = null;
        let targetShelter = null;

        let currentLat = 43.03806;
        let currentLng = 141.48471;
        let currentHeading = 0;
        let targetHeading = 0;
        let isTracking = true;

        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const mapWrapper = document.getElementById('map-wrapper');
        const centerMarker = document.getElementById('center-marker');
        const resumeBtn = document.getElementById('resume-btn');
        const uiOverlay = document.getElementById('ui-overlay');
        const statusText = document.getElementById('status-text');
        const shelterCount = document.getElementById('shelter-count');
        const mapContainer = document.getElementById('map-container');
        const navPanel = document.getElementById('nav-panel');
        const targetNameEl = document.getElementById('target-name');
        const targetDistEl = document.getElementById('target-dist');
        const cancelNavBtn = document.getElementById('cancel-nav-btn');

        // 1. スタートボタン押下時
        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('コンパスの利用が許可されませんでした。');
                        return; 
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            startScreen.style.display = 'none';
            mapWrapper.style.display = 'block';
            centerMarker.style.display = 'block';
            uiOverlay.style.display = 'flex';

            initMap();
            startSensors();
        });

        // 2. 地図の初期構築
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([currentLat, currentLng], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            markerLayer = L.layerGroup().addTo(map);

            shelterCount.innerText = 'データ読込中...';
            fetch('./shelters.json')
                .then(res => res.json())
                .then(data => {
                    allShelters = data;
                    updateVisibleShelters(currentLat, currentLng);
                })
                .catch(err => {
                    shelterCount.innerText = 'データ読込失敗';
                });

            map.on('dragstart', () => {
                isTracking = false;
                resumeBtn.style.display = 'block';
            });

            map.on('moveend', () => {
                const center = map.getCenter();
                updateVisibleShelters(center.lat, center.lng);
            });
        }

        // 3. 周辺の避難所描画とポップアップ設定
        function updateVisibleShelters(centerLat, centerLng) {
            if (!allShelters || allShelters.length === 0) return;
            
            markerLayer.clearLayers();
            let count = 0;
            const range = 0.05;

            for (let i = 0; i < allShelters.length; i++) {
                const s = allShelters[i];
                const sLat = s.lat;
                const sLon = s.lon !== undefined ? s.lon : s.lng;

                if (sLat && sLon && Math.abs(sLat - centerLat) < range && Math.abs(sLon - centerLng) < range) {
                    const popupContent = document.createElement('div');
                    popupContent.className = 'text-center p-1';
                    popupContent.innerHTML = `
                        <div class="font-bold text-gray-900 text-sm mb-2">${s.name}</div>
                        <button class="nav-go-btn bg-blue-600 text-white text-xs font-bold py-1.5 px-3 rounded shadow">
                            ここへナビ開始
                        </button>
                    `;
                    
                    popupContent.querySelector('.nav-go-btn').addEventListener('click', () => {
                        setTargetShelter(s.name, sLat, sLon);
                        map.closePopup();
                    });

                    L.marker([sLat, sLon])
                     .addTo(markerLayer)
                     .bindPopup(popupContent);
                    count++;
                }
            }
            shelterCount.innerText = `周辺避難所: ${count}件`;
        }

        // 4. 目的地セット＆誘導ライン描画
        function setTargetShelter(name, lat, lng) {
            targetShelter = { name, lat, lng };
            targetNameEl.innerText = name;
            navPanel.style.display = 'flex';
            isTracking = true;
            resumeBtn.style.display = 'none';
            map.setView([currentLat, currentLng], map.getZoom());
            updateNavigationLine();
        }

        // 案内終了ボタン
        cancelNavBtn.addEventListener('click', () => {
            targetShelter = null;
            navPanel.style.display = 'none';
            if (guideLine) {
                map.removeLayer(guideLine);
                guideLine = null;
            }
        });

        // 誘導ラインと距離の更新
        function updateNavigationLine() {
            if (!targetShelter) return;

            const from = L.latLng(currentLat, currentLng);
            const to = L.latLng(targetShelter.lat, targetShelter.lng);
            const distance = Math.round(from.distanceTo(to)); // メートル単位の直線距離

            targetDistEl.innerText = distance >= 1000 
                ? `残り ${(distance / 1000).toFixed(2)} km` 
                : `残り ${distance} m`;

            if (guideLine) {
                guideLine.setLatLngs([from, to]);
            } else {
                guideLine = L.polyline([from, to], {
                    color: '#ef4444', // 目立つ赤色
                    weight: 5,
                    opacity: 0.8,
                    dashArray: '10, 10' // 点線
                }).addTo(map);
            }
        }

        // 5. センサー類の開始
        function startSensors() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    position => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        statusText.innerText = 'GPS受信中';
                        
                        if (isTracking) {
                            map.setView([currentLat, currentLng], map.getZoom(), { animate: false });
                        }
                        updateNavigationLine();
                    },
                    error => {
                        statusText.innerText = 'GPSエラー: ' + error.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            }

            window.addEventListener('deviceorientation', event => {
                let heading = null;
                if (event.webkitCompassHeading) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    heading = Math.abs(event.alpha - 360);
                }

                if (heading !== null) {
                    targetHeading = heading;
                }
            });

            updateRotation();
        }

        // 6. 地図の回転アニメーション
        function updateRotation() {
            let diff = targetHeading - currentHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            
            currentHeading += diff * 0.1;
            
            if (isTracking) {
                mapContainer.style.transform = `rotate(-${currentHeading}deg)`;
            } else {
                mapContainer.style.transform = `rotate(0deg)`;
            }

            requestAnimationFrame(updateRotation);
        }

        // 7. GPS追従モードへの復帰
        resumeBtn.addEventListener('click', () => {
            isTracking = true;
            resumeBtn.style.display = 'none';
            map.setView([currentLat, currentLng], map.getZoom());
        });
    </script>
</body>
</html>
