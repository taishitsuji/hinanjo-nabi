<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オフライン避難所ナビ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { overflow: hidden; touch-action: none; background-color: #0f172a; margin: 0; }
        
        /* 地図コンテナのスタイル */
        #map-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: 10; display: none;
        }
        #map-container {
            position: absolute; top: -50vh; left: -50vw;
            width: 200vw; height: 200vh;
            will-change: transform;
        }
        #map { width: 100%; height: 100%; background: #1e293b; }

        /* UIオーバーレイ */
        #ui-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
            background: linear-gradient(to top, rgba(15,23,42,1) 60%, rgba(15,23,42,0));
            padding: 40px 20px 20px 20px;
            display: none;
        }

        /* 中央のナビゲーションアイコン（自分の向き） */
        #center-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 40;
            width: 40px; height: 40px; pointer-events: none;
            display: none;
        }

        /* フリールックから現在地に戻るボタン */
        #resume-btn {
            position: absolute; top: 20px; right: 20px; z-index: 60;
            display: none;
        }
    </style>
</head>
<body class="text-white font-sans selection:bg-yellow-500 selection:text-black">

    <!-- スタート画面 -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-50 p-6 text-center">
        <h1 class="text-3xl font-bold mb-2 text-yellow-400">避難所マップナビ</h1>
        <p class="text-gray-400 text-sm mb-8">自分が向いている方向に地図が回転します。<br>圏外でもレーダーとして機能します。</p>
        <button id="start-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 px-10 rounded-full text-xl shadow-[0_0_20px_rgba(234,179,8,0.5)] active:scale-95 transition">
            ナビゲーション開始
        </button>
    </div>

    <!-- マップ画面 -->
    <div id="map-wrapper">
        <div id="map-container">
            <div id="map"></div>
        </div>
        
        <!-- 中央のポインター -->
        <div id="center-marker">
            <div class="w-6 h-6 bg-blue-500 border-4 border-white rounded-full shadow-[0_0_15px_rgba(59,130,246,0.8)] mx-auto mt-2 relative">
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-l-transparent border-r-transparent border-b-blue-500"></div>
            </div>
        </div>
        
        <button id="resume-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-full shadow-lg active:scale-95 transition">
            GPSに追従する
        </button>
    </div>

    <!-- 下部のステータス表示 -->
    <div id="ui-overlay" class="flex justify-between items-end text-sm">
        <div id="status-text" class="text-gray-300">GPS測位待機中...</div>
        <div id="shelter-count" class="text-yellow-400 font-bold"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録エラー:', err));
        }

        let map;
        let allShelters = [];
        let markerLayer;
        let currentLat = 43.03806; // 初期値（札幌付近）
        let currentLng = 141.48471;
        let currentHeading = 0;
        let targetHeading = 0;
        let isTracking = true;

        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const mapWrapper = document.getElementById('map-wrapper');
        const centerMarker = document.getElementById('center-marker');
        const resumeBtn = document.getElementById('resume-btn');
        const uiOverlay = document.getElementById('ui-overlay');
        const statusText = document.getElementById('status-text');
        const shelterCount = document.getElementById('shelter-count');
        const mapContainer = document.getElementById('map-container');

        // 1. スタートボタン押下時
        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('コンパスの利用が許可されませんでした。iPhoneの設定からSafariのセンサーへのアクセスを許可してください。');
                        return; 
                    }
                } catch (error) {
                    console.error('許可リクエストエラー:', error);
                }
            }

            startScreen.style.display = 'none';
            mapWrapper.style.display = 'block';
            centerMarker.style.display = 'block';
            uiOverlay.style.display = 'flex';

            initMap();
            startSensors();
        });

        // 2. 地図の初期構築
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([currentLat, currentLng], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            markerLayer = L.layerGroup().addTo(map);

            // 避難所データの読み込み
            shelterCount.innerText = 'データ読込中...';
            fetch('./shelters.json')
                .then(res => res.json())
                .then(data => {
                    allShelters = data;
                    updateVisibleShelters(currentLat, currentLng);
                })
                .catch(err => {
                    console.error('避難所データエラー:', err);
                    shelterCount.innerText = 'データ読込失敗';
                });

            // 指で地図を動かしたとき
            map.on('dragstart', () => {
                isTracking = false;
                resumeBtn.style.display = 'block';
            });

            // 地図の移動が終わったら周辺の避難所を再描画
            map.on('moveend', () => {
                const center = map.getCenter();
                updateVisibleShelters(center.lat, center.lng);
            });
        }

        // 周辺の避難所だけを描画（スマホのフリーズ防止）
        function updateVisibleShelters(centerLat, centerLng) {
            if (!allShelters || allShelters.length === 0) return;
            
            markerLayer.clearLayers();
            let count = 0;
            // 緯度経度で約0.05度（約5km四方）の範囲だけピンを立てる
            const range = 0.05; 

            for (let i = 0; i < allShelters.length; i++) {
                const s = allShelters[i];
                const sLat = s.lat;
                const sLon = s.lon !== undefined ? s.lon : s.lng; // lon と lng 両対応

                if (sLat && sLon && Math.abs(sLat - centerLat) < range && Math.abs(sLon - centerLng) < range) {
                    L.marker([sLat, sLon])
                     .addTo(markerLayer)
                     .bindPopup(`<b>${s.name}</b>`);
                    count++;
                }
            }
            shelterCount.innerText = `周辺避難所: ${count}件`;
        }

        // 3. センサー類の開始
        function startSensors() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    position => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        statusText.innerText = 'GPS受信中';
                        
                        if (isTracking) {
                            map.setView([currentLat, currentLng], map.getZoom(), { animate: false });
                        }
                    },
                    error => {
                        statusText.innerText = 'GPSエラー: ' + error.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            }

            window.addEventListener('deviceorientation', event => {
                let heading = null;
                if (event.webkitCompassHeading) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    heading = Math.abs(event.alpha - 360);
                }

                if (heading !== null) {
                    targetHeading = heading;
                }
            });

            updateRotation();
        }

        // 4. 地図の回転アニメーション
        function updateRotation() {
            let diff = targetHeading - currentHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            
            currentHeading += diff * 0.1;
            
            if (isTracking) {
                mapContainer.style.transform = `rotate(-${currentHeading}deg)`;
            } else {
                mapContainer.style.transform = `rotate(0deg)`;
            }

            requestAnimationFrame(updateRotation);
        }

        // 5. GPS追従モードへの復帰
        resumeBtn.addEventListener('click', () => {
            isTracking = true;
            resumeBtn.style.display = 'none';
            map.setView([currentLat, currentLng], map.getZoom());
        });
    </script>
</body>
</html>
